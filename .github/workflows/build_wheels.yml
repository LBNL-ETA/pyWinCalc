name: Build wheels

on: [push, pull_request]

jobs:
  build_wheels_windows:
    name: ${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.arch }} wheels
    runs-on: ${{ matrix.os }}
    env:
      TEMP: C:\Temp
      TMP: C:\Temp

    strategy:
      matrix:
        os: [windows-2022]
        arch: [x86, x64]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}

      - name: Install packages
        run: |
          pip install wheel setuptools build

      - name: build
        run: python -m build

      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ./dist/*.whl

  build_wheels_mac:
    name: ${{ matrix.os }} ${{ matrix.python-version }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, macos-15, macos-26]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      SYSTEM_VERSION_COMPAT: 0
      CIBW_ARCHS_MACOS: "x86_64 universal2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install wheel setuptools build

      - name: build
        run: python -m build

      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_id }}
          path: ./dist/*.whl

          
  combine_wheels:
    name: Combine all wheels into one zip
    runs-on: ubuntu-24.04
    needs: [build_wheels_windows, build_wheels_mac]
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Show downloaded files (debug)
        run: find all_wheels

      - name: Diagnose wheel presence & collisions
        run: |
          echo "=== ALL WHEELS (full paths) ==="
          find all_wheels -name '*.whl' -print | sort
      
          echo "=== WHEEL BASENAMES (duplicates indicate overwrite risk) ==="
          find all_wheels -name '*.whl' -printf '%f\n' | sort | uniq -c | sort -nr | head -50
      
          echo "=== UNIVERSAL2 WHEELS FOUND ==="
          find all_wheels -name '*universal2*.whl' -print | sort || true

      - name: Combine wheels
        run: |
          mkdir combined
          find all_wheels -name '*.whl' -exec cp {} combined/ \;

      - name: Upload final wheel archive
        uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: combined/
