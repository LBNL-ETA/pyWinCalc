name: Build wheels

on: [push, pull_request]

jobs:
  build_wheels_windows:
    name: ${{ matrix.os }} ${{ matrix.python-version }}    ${{ matrix.arch }} wheels
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TEMP: C:\Temp
      TMP: C:\Temp
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        arch: [x86, x64]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Set temp dirs
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$env:RUNNER_TEMP"  | Out-File -FilePath $env:GITHUB_ENV -Append
          
      - name: Support longpaths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}

      - name: Install packages
        run: |
          pip install wheel setuptools build

      - name: build
        run: python -m build -vv
          
      - name: Install built wheel + pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest deprecation pytest-rerunfailures
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName

      - name: Ensure test-results directory exists
        run: mkdir test-results
  
      - name: Run tests against installed wheel
        run: |
          pytest -ra -vv -x --maxfail=1 --showlocals --reruns 2 --reruns-delay 1 --junitxml=test-results/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: test-results/pytest.xml
          
      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ./dist/*.whl

  build_wheels_mac_arm64:
    name: macOS wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14]

    env:
      SYSTEM_VERSION_COMPAT: 0
      CIBW_ARCHS_MACOS: "arm64"
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_BUILD_VERBOSITY: 1
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11
      CIBW_TEST_REQUIRES: pytest
      CIBW_TEST_COMMAND: "pytest -ra -vv {project}/test --junitxml={project}/test-results/junit.xml"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/junit.xml

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: test-results/junit.xml
          fail_on_failure: true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ github.run_id }}
          path: wheelhouse/*.whl

  build_wheels_mac_x86_64:
    name: macOS wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15-intel]

    env:
      SYSTEM_VERSION_COMPAT: 0
      CIBW_ARCHS_MACOS: "x86_64"
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      CIBW_BUILD_VERBOSITY: 1
      CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=10.15
      CIBW_TEST_REQUIRES: pytest
      CIBW_TEST_COMMAND: "pytest -ra -vv {project}/test --junitxml={project}/test-results/junit.xml"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.1

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/junit.xml

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: test-results/junit.xml
          fail_on_failure: true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ github.run_id }}
          path: wheelhouse/*.whl

  build_wheels_manylinux_x86_64:
    name: Build manylinux wheels (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels with cibuildwheel
        env:
          CIBW_PLATFORM: "linux"
          CIBW_SKIP: "cp36-* cp37-* cp38-* pp37-* pp38-* pp39-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          CIBW_BUILD_VERBOSITY: 3  # Enable detailed logging
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest -ra -vv {project}/test --junitxml={project}/test-results/junit.xml"
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/junit.xml

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: test-results/junit.xml
          fail_on_failure: true

      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-${{ github.run_id }}
          path: wheelhouse/*.whl

  build_wheels_manylinux_arm64:
    name: Build manylinux wheels (ARM64)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["cp310", "cp311", "cp312", "cp313", "cp314"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      # Register QEMU for cross-architecture emulation
      - name: Set up QEMU for cross-compilation
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all  # Ensures ARM64 is fully supported
  
      - name: Debug - Test ManyLinux Container
        run: |
          echo "Testing uname -a inside the container..."
          docker run --rm --platform linux/aarch64 quay.io/pypa/manylinux_2_28_aarch64 uname -a
          
          echo "Testing Python inside the container..."
          docker run --rm --platform linux/aarch64 quay.io/pypa/manylinux_2_28_aarch64 python3 --version
  
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel
  
      - name: Build wheels with cibuildwheel
        env:
          CIBW_PLATFORM: "linux"
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_MANYLINUX_AARCH64_IMAGE: "quay.io/pypa/manylinux_2_28_aarch64"
          CIBW_ENVIRONMENT: "CXXFLAGS='-g -O2 -fno-omit-frame-pointer'"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest -ra -vv {project}/test --junitxml={project}/test-results/junit.xml"
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/junit.xml

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: test-results/junit.xml
          fail_on_failure: true
  
      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-arm64-${{ matrix.python-version }}-${{ github.run_id }}
          path: wheelhouse/*.whl
          
          
  combine_wheels:
    name: Combine all wheels into one zip
    runs-on: ubuntu-24.04
    needs: [build_wheels_windows, build_wheels_mac_arm64, build_wheels_mac_x86_64, build_wheels_manylinux_x86_64, build_wheels_manylinux_arm64]
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Show downloaded files (debug)
        run: find all_wheels

      - name: Diagnose wheel presence & collisions
        run: |
          echo "=== ALL WHEELS (full paths) ==="
          find all_wheels -name '*.whl' -print | sort
      
          echo "=== WHEEL BASENAMES (duplicates indicate overwrite risk) ==="
          find all_wheels -name '*.whl' -printf '%f\n' | sort | uniq -c | sort -nr | head -50
      
          echo "=== UNIVERSAL2 WHEELS FOUND ==="
          find all_wheels -name '*universal2*.whl' -print | sort || true

      - name: Combine wheels
        run: |
          mkdir combined
          find all_wheels -name '*.whl' -exec cp {} combined/ \;

      - name: Upload final wheel archive
        uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: combined/
