name: Build wheels

on: [push, pull_request]

jobs:
  build_wheels_windows:
    name: ${{ matrix.os }} ${{ matrix.python-version }}    ${{ matrix.arch }} wheels
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
      TEMP: C:\Temp
      TMP: C:\Temp
    
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        arch: [x86, x64]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}

      - name: Install packages
        run: |
          pip install wheel setuptools build

      - name: build
        run: python -m build -vv
          
      - name: Install built wheel + pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest deprecation pytest-rerunfailures
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName

      - name: Ensure test-results directory exists
        run: mkdir test-results

      - name: Enable crash dumps (Windows)
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "$env:GITHUB_WORKSPACE\dumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
          New-Item -ItemType Directory -Force dumps | Out-Null

      - name: Show where pywincalc is imported from
        shell: pwsh
        run: |
          python -c "import pywincalc,sys; print('pywincalc:', pywincalc.__file__); print('exe:', sys.executable)"
  
      - name: Run tests (monitor memory)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $report = Join-Path $env:GITHUB_WORKSPACE "test-results\pytest.xml"
          $log    = Join-Path $env:GITHUB_WORKSPACE "test-results\pytest.log"
      
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "python"
          $psi.Arguments = "-X faulthandler -m pytest -vv -rA -s --full-trace --tb=long --showlocals --reruns 2 --reruns-delay 1 --junitxml `"$report`" test"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError  = $true
          $psi.UseShellExecute = $false
      
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo = $psi
          $null = $p.Start()
      
          # stream output to console + file
          $outTask = $p.StandardOutput.ReadToEndAsync()
          $errTask = $p.StandardError.ReadToEndAsync()
      
          while (-not $p.HasExited) {
            try {
              $proc = Get-Process -Id $p.Id -ErrorAction Stop
              $wsMB  = [math]::Round($proc.WorkingSet64/1MB, 1)
              $pmMB  = [math]::Round($proc.PrivateMemorySize64/1MB, 1)
              $vmMB  = [math]::Round($proc.VirtualMemorySize64/1MB, 1)
              Write-Host "MEM pid=$($p.Id) WS=${wsMB}MB Private=${pmMB}MB VM=${vmMB}MB"
            } catch { }
            Start-Sleep -Seconds 2
          }
      
          $stdout = $outTask.Result
          $stderr = $errTask.Result
          $stdout | Tee-Object -FilePath $log
          $stderr | Add-Content -Path $log
      
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Dump recent crash / WER events
        if: always()
        shell: pwsh
        run: |
          Get-WinEvent -LogName Application -MaxEvents 50 |
            Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting' } |
            Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Format-List
            
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            test-results/pytest.xml
            test-results/pytest.log

          
      - name: Upload crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dumps-${{ matrix.python-version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: dumps/*

      - name: List test-results
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse test-results | Format-List FullName,Length
    
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: test-results/pytest.xml
          
      - name: upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}-${{ matrix.arch }}-${{ github.run_id }}
          path: ./dist/*.whl

            
  combine_wheels:
    name: Combine all wheels into one zip
    runs-on: ubuntu-24.04
    needs: [build_wheels_windows]
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_wheels

      - name: Show downloaded files (debug)
        run: find all_wheels

      - name: Diagnose wheel presence & collisions
        run: |
          echo "=== ALL WHEELS (full paths) ==="
          find all_wheels -name '*.whl' -print | sort
      
          echo "=== WHEEL BASENAMES (duplicates indicate overwrite risk) ==="
          find all_wheels -name '*.whl' -printf '%f\n' | sort | uniq -c | sort -nr | head -50
      
          echo "=== UNIVERSAL2 WHEELS FOUND ==="
          find all_wheels -name '*universal2*.whl' -print | sort || true

      - name: Combine wheels
        run: |
          mkdir combined
          find all_wheels -name '*.whl' -exec cp {} combined/ \;

      - name: Upload final wheel archive
        uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: combined/
